name: Upload media files to Qiniu when they change
on:
  push:
    branches:
      - master
      # Keep this list explicit. Before adding a branch, make sure that direct
      # pushes to it are restricted because this workflow uses cloud credentials.
      - release-1.0
      - release-2.0
      - release-2.1-legacy
      - release-2.1
      - release-3.0
      - release-3.1
      - release-4.0
      - release-5.0
      - release-5.1
      - release-5.2
      - release-5.3
      - release-5.4
      - release-6.0
      - release-6.1
      - release-6.2
      - release-6.3
      - release-6.4
      - release-6.5
      - release-6.6
      - release-7.0
      - release-7.1
      - release-7.2
      - release-7.3
      - release-7.4
      - release-7.5
      - release-7.6
      - release-8.0
      - release-8.1
      - release-8.2
      - release-8.3
      - release-8.4
      - release-8.5
    paths:
      - media/**

permissions:
  contents: read

jobs:
  upload:
    name: Upload media files
    runs-on: ubuntu-latest
    env:
      COSCLI_SHA256: 7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
      COSCLI_VERSION: 1.0.8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      #- name: Configure awscli
      #  run: |
      #    pip3 install --upgrade setuptools
      #    pip3 install awscli
      #    printf "%s\n" ${{ secrets.AWS_ACCESS_KEY }} ${{ secrets.AWS_SECRET_KEY }} ${{ secrets.AWS_REGION }} "json" | aws configure

      - name: Install coscli
        env:
          COSCLI_PATH: ${{ runner.temp }}/coscli
        run: |
          curl --fail --location --silent --show-error \
            --output "$COSCLI_PATH" \
            "https://github.com/tencentyun/coscli/releases/download/v${COSCLI_VERSION}/coscli-v${COSCLI_VERSION}-linux-amd64"
          echo "${COSCLI_SHA256}  ${COSCLI_PATH}" | sha256sum --check -
          chmod 755 "$COSCLI_PATH"
          "$COSCLI_PATH" --version

      - name: Stage publishable media
        env:
          MEDIA_UPLOAD_DIR: ${{ runner.temp }}/media-upload
        run: |
          set -euo pipefail
          mkdir -p "$MEDIA_UPLOAD_DIR"
          find media -type f \
            \( -iname '*.gif' -o -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.png' -o -iname '*.svg' \) \
            -print0 | while IFS= read -r -d '' media_file; do
              relative_path="${media_file#media/}"
              destination="$MEDIA_UPLOAD_DIR/$relative_path"
              mkdir -p "$(dirname "$destination")"
              cp "$media_file" "$destination"
              chmod 0644 "$destination"
            done

      - name: Upload to COS
        env:
          COSCLI_PATH: ${{ runner.temp }}/coscli
          MEDIA_UPLOAD_DIR: ${{ runner.temp }}/media-upload
          TENCENTCLOUD_BUCKET_ID: ${{ secrets.TENCENTCLOUD_BUCKET_ID }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: |
          COSCLI_CONFIG="$(mktemp "${RUNNER_TEMP}/coscli.XXXXXX.yaml")"
          export COSCLI_CONFIG
          trap 'rm -f "$COSCLI_CONFIG"' EXIT

          python3 <<'PY'
          import json
          import os

          config = {
              "cos": {
                  "base": {
                      "disableencryption": "true",
                      "mode": "SecretKey",
                      "protocol": "https",
                      "secretid": os.environ["TENCENTCLOUD_SECRET_ID"],
                      "secretkey": os.environ["TENCENTCLOUD_SECRET_KEY"],
                  }
              }
          }
          with open(os.environ["COSCLI_CONFIG"], "w", encoding="utf-8") as config_file:
              json.dump(config, config_file)
          os.chmod(os.environ["COSCLI_CONFIG"], 0o600)
          PY

          "$COSCLI_PATH" sync "$MEDIA_UPLOAD_DIR/" "cos://${TENCENTCLOUD_BUCKET_ID}/media/images/docs-cn" \
            --config-path "$COSCLI_CONFIG" \
            --recursive \
            --routines 16 \
            --endpoint cos.ap-beijing.myqcloud.com

  cdn-refresh:
    needs: upload
    runs-on: ubuntu-latest
    name: Refresh CDN Cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Tencent Cloud CLI
        run: pipx install tccli==3.1.194.1

      - name: Purge production CDN cache
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: tccli cdn PurgePathCache --Paths '["https://docs-download.pingcap.com/media/images/docs-cn/"]' --FlushType delete
