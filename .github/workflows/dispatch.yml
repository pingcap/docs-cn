name: Trigger docs site update

on:
  push:
    paths-ignore:
      - ".github/**"
    branches:
      - master
      - release-7.2
      - release-7.1
      - release-7.0
      - release-6.5
      - release-6.1
      - release-5.4
      - release-5.3
      - release-5.2
      - release-5.1
      - release-5.0
      - release-4.0
      - release-3.0

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger docs-staging workflow
        env:
          DOCS_STAGING_TOKEN: ${{ secrets.DOCS_STAGING }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          CURL_CONFIG="$(mktemp "${RUNNER_TEMP}/docs-dispatch.XXXXXX.conf")"
          PAYLOAD_FILE="$(mktemp "${RUNNER_TEMP}/docs-dispatch.XXXXXX.json")"
          export CURL_CONFIG PAYLOAD_FILE
          trap 'rm -f "$CURL_CONFIG" "$PAYLOAD_FILE"' EXIT

          python3 <<'PY'
          import json
          import os

          with open(os.environ["CURL_CONFIG"], "w", encoding="utf-8") as config_file:
              config_file.write(
                  f'header = "Authorization: Bearer {os.environ["DOCS_STAGING_TOKEN"]}"\n'
              )
          os.chmod(os.environ["CURL_CONFIG"], 0o600)

          payload = {
              "ref": "main",
              "inputs": {
                  "full": "false",
                  "repo": os.environ["SOURCE_REPOSITORY"],
                  "branch": os.environ["SOURCE_BRANCH"],
              },
          }
          with open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8") as payload_file:
              json.dump(payload, payload_file)
          os.chmod(os.environ["PAYLOAD_FILE"], 0o600)
          PY

          curl --fail-with-body --silent --show-error \
            --config "$CURL_CONFIG" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$PAYLOAD_FILE" \
            https://api.github.com/repos/pingcap/docs-staging/actions/workflows/update.yml/dispatches
