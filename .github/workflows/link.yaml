name: Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report_artifact_id: ${{ steps.upload_report.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore lychee cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
  
      - name: Check Links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # For parameter description, see https://github.com/lycheeverse/lychee#commandline-parameters
          fail: false
          failIfEmpty: false
          args: --root-dir $(pwd) --cache --max-cache-age 8d -E -i -n -t 45 --exclude-path '^releases/' --exclude-path '^tidb-cloud/releases/' -- **/*.md *.md
          output: out.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link report
        id: upload_report
        if: steps.lychee.outputs.exit_code != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-report
          path: out.md
          if-no-files-found: error

      - name: Fail if there were link errors
        if: steps.lychee.outputs.exit_code != '0'
        run: exit "${{ steps.lychee.outputs.exit_code }}"

  createIssue:
    needs: linkChecker
    if: ${{ always() && needs.linkChecker.result == 'failure' && needs.linkChecker.outputs.report_artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Download link report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: link-report

      - name: Create Issue From File
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: Broken Link Detected
          content-filepath: out.md
